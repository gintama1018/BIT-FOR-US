<html class="light" lang="en"><head>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400;
        }
        
        /* Map specific styles */
        .map-container {
            /* Simulating a warm-toned map background */
            background-color: #f3ede4; /* surface-container */
            background-image: 
                radial-gradient(#dbc1b5 1px, transparent 1px), /* outline-variant */
                radial-gradient(#dbc1b5 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            position: relative;
            overflow: hidden;
            touch-action: none; /* Prevent browser handling for custom pan/zoom if implemented */
        }
        
        /* Abstract topographical lines simulation */
        .topo-line {
            position: absolute;
            border: 1px solid #e8e2d9; /* surface-variant */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            pointer-events: none;
        }
        
        .pulse-ring {
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(3); opacity: 0; }
        }
        
        /* Bottom sheet transition */
        .bottom-sheet-enter {
            transform: translateY(100%);
        }
        .bottom-sheet-enter-active {
            transform: translateY(0);
            transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>

<div class="topo-line w-[60%] h-[80%] top-[20%] left-[-10%] opacity-40" style="border-radius: 30% 70% 40% 60% / 50% 30% 70% 40%;"></div>
<!-- Map Canvas / Panning Area -->
<div class="absolute inset-0 w-full h-full" id="map-plane" style="transform: translate(0px, 0px) scale(1);">
<!-- Self Node -->
<button aria-label="Current Location" class="absolute top-[50%] left-[50%] -translate-x-1/2 -translate-y-1/2 group z-20">
<div class="absolute inset-0 bg-primary/20 rounded-full pulse-ring"></div>
<div class="w-6 h-6 rounded-full bg-primary border-2 border-surface shadow-sm relative flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-on-primary rounded-full"></div>
</div>
</button>
<!-- Peer Node 1 (Selected/Target) -->
<button aria-label="Peer Node: Elara" class="absolute top-[35%] left-[65%] -translate-x-1/2 -translate-y-1/2 group z-10" onclick="document.getElementById('peer-sheet').classList.remove('translate-y-full')">

</svg>

</button>

<div class="w-5 h-5 rounded-full bg-on-surface-variant border-2 border-surface shadow-sm transition-transform group-hover:scale-110"></div>
<span class="absolute top-full left-1/2 -translate-x-1/2 mt-1 font-label-md text-label-md text-on-surface-variant whitespace-nowrap bg-surface/80 px-1.5 py-0.5 rounded backdrop-blur-sm border border-outline-variant/30">Jace</span>
</button>
<!-- SOS Marker -->

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant opacity-60 hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="hub">hub</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant opacity-60 hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="forum">forum</span>

</a>

<script>
        // Simple map interaction script (visual only for mockup purposes)
        const mapPlane = document.getElementById('map-plane');
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;

        mapPlane.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            mapPlane.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            mapPlane.style.transform = `translate(${translateX}px, ${translateY}px) scale(1)`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            mapPlane.style.cursor = 'grab';
        });
        
        // Touch events for mobile dragging
        mapPlane.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            // e.preventDefault(); // Prevent scrolling while panning map
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            mapPlane.style.transform = `translate(${translateX}px, ${translateY}px) scale(1)`;
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
