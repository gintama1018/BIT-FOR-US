<style>
        .compass-pulse {
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .needle-swing {
            animation: swing 6s ease-in-out infinite alternate;
        }
        @keyframes swing {
            0% { transform: rotate(242deg); }
            100% { transform: rotate(252deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="sticky top-0 w-full flex items-center justify-between px-margin-mobile py-stack-md bg-background z-40">
<button aria-label="Go back" class="p-base rounded-full hover:bg-surface-container-lowest transition-all duration-300 text-primary group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center">Homing</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Follow the signal.</p>
</div>
<button aria-label="Settings" class="p-base rounded-full hover:bg-surface-container-lowest transition-all duration-300 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pb-stack-lg flex flex-col justify-center items-center gap-stack-lg relative w-full max-w-2xl mx-auto">
<!-- Compass Hero Section -->
<section class="relative w-full aspect-square max-w-[320px] md:max-w-[400px] flex items-center justify-center">
<!-- Subtle outer rings -->
<div class="absolute inset-0 border border-outline-variant/30 rounded-full"></div>
<div class="absolute inset-[8px] border border-outline-variant/20 rounded-full compass-pulse" style="animation-delay: -1.5s;"></div>
<div class="absolute inset-gutter border border-outline-variant/10 rounded-full compass-pulse"></div>
<!-- Compass Base -->
<div class="w-64 h-64 md:w-80 md:h-80 bg-surface-container rounded-full shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)] border border-surface-container-highest relative flex items-center justify-center">
<!-- Cardinal Points -->
<div class="absolute top-4 font-label-md text-label-md text-on-surface-variant opacity-70">N</div>
<div class="absolute right-4 font-label-md text-label-md text-on-surface-variant opacity-70">E</div>
<div class="absolute bottom-4 font-label-md text-label-md text-on-surface-variant opacity-70">S</div>
<div class="absolute left-4 font-label-md text-label-md text-on-surface-variant opacity-70">W</div>
<!-- Degree markers (decorative) -->
<svg class="absolute inset-0 w-full h-full" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle class="text-outline-variant" cx="50" cy="50" r="48" stroke="currentColor" stroke-dasharray="1 3" stroke-width="0.2"></circle>
<circle class="text-outline-variant opacity-50" cx="50" cy="50" r="40" stroke="currentColor" stroke-dasharray="2 4" stroke-width="0.5"></circle>
</svg>
<!-- The Needle & Target Direction -->
<div class="absolute w-full h-full needle-swing transform rotate-[247deg] transition-transform duration-1000 ease-out flex flex-col items-center justify-start py-8">
<!-- Primary Direction Indicator -->
<div class="w-1 h-1/2 bg-primary rounded-full relative shadow-[0_0_15px_rgba(150,68,7,0.3)]">
<!-- Arrowhead -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-l-transparent border-r-transparent border-b-primary"></div>
</div>
</div>
<!-- Center Hub -->
<div class="w-12 h-12 bg-background rounded-full border border-outline-variant z-10 flex items-center justify-center shadow-sm">
<div class="w-3 h-3 bg-primary rounded-full"></div>
</div>
</div>
</section>
<!-- Target Info Card (Glassmorphism/Minimalist) -->
<section class="w-full bg-surface-container-lowest/80 backdrop-blur-md rounded-[2rem] p-stack-md border border-outline-variant flex flex-col items-center gap-stack-sm text-center">
<div class="flex items-center gap-base mb-2">
<span class="material-symbols-outlined text-primary" data-icon="person_pin">person_pin</span>
<h2 class="font-title-lg text-title-lg text-on-surface">Target: Riya</h2>
</div>
<div class="flex items-center justify-center gap-gutter font-headline-md text-headline-md text-on-surface w-full">
<span>184 m</span>
<span class="w-1 h-1 bg-outline rounded-full"></span>
<span class="text-primary">247° SW</span>
</div>
<div class="flex flex-col gap-base mt-4 w-full px-gutter">
<div class="flex justify-between items-center w-full font-label-lg text-label-lg">
<span class="text-on-surface-variant">Signal Status</span>
<span class="text-tertiary flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span> Signal strong</span>
</div>
<div class="w-full bg-surface-variant h-2 rounded-full overflow-hidden">
<div class="bg-tertiary h-full w-4/5 rounded-full"></div>
</div>
<div class="flex justify-between items-center w-full font-label-md text-label-md text-on-surface-variant mt-1">
<span>Last seen 12 sec ago</span>
<span>Updating...</span>
</div>
</div>
</section>
<!-- Action Buttons Layout -->
<section class="w-full grid grid-cols-1 md:grid-cols-2 gap-gutter mt-auto">
<button class="w-full bg-primary text-on-primary py-4 px-6 rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-95 transition-all shadow-[0_4px_20px_rgba(150,68,7,0.15)] group">
<span class="material-symbols-outlined group-hover:-translate-y-1 transition-transform" data-icon="near_me">near_me</span>
                Navigate to Target
            </button>
<button class="w-full bg-surface-container-high text-on-surface py-4 px-6 rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-variant border border-outline-variant active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="map">map</span>
                Open Map
            </button>
</section>
</main>
<!-- BottomNavBar (Suppressed as this is a focused task/destination screen needing full attention) -->
<!-- Navigation shell is deliberately excluded here per Semantic Shell Mandate for Task-Focused/Linear screens -->
</body></html>
