<style>
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            margin-top: -75vw;
            margin-left: -75vw;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(150, 68, 7, 0.1) 100%);
            animation: sweep 4s linear infinite;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(150, 68, 7, 0.3);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0% { width: 40px; height: 40px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        /* Subtle grid background for the radar area */
        .radar-bg {
            background-image: radial-gradient(circle at center, rgba(136, 115, 104, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>

<body class="bg-background text-on-background min-h-screen font-body-lg overflow-hidden flex flex-col relative">
<!-- TopAppBar -->
<header class="bg-background sticky top-0 w-full flex flex-col items-center justify-between px-container-padding py-stack-md z-40">
<div class="w-full flex items-center justify-between">
<button class="text-on-surface-variant hover:bg-surface-container-lowest transition-all duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">signal_cellular_alt</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Network</h1>
<button class="text-on-surface-variant hover:bg-surface-container-lowest transition-all duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">emergency</span>
</button>
</div>
<div class="mt-2 text-center">
<h2 class="font-title-lg text-title-lg text-on-surface">Mesh Radar</h2>
<p class="font-label-md text-label-md text-on-surface-variant mt-1">12 discovered • 5 connected</p>
</div>
</header>
<!-- Radar Canvas (Main Area) -->
<main class="flex-grow relative radar-bg overflow-hidden flex items-center justify-center -mt-[60px]">
<!-- Radar Rings -->
<div class="absolute w-[300px] h-[300px] rounded-full border border-outline-variant/30"></div>
<div class="absolute w-[200px] h-[200px] rounded-full border border-outline-variant/40"></div>
<div class="absolute w-[100px] h-[100px] rounded-full border border-outline-variant/50"></div>
<!-- Radar Sweep Animation -->
<div class="radar-sweep"></div>
<!-- Connecting Lines (SVG overlay) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 0;">
<!-- Line to Node 1 (Riya) -->
<line stroke="rgba(150, 68, 7, 0.4)" stroke-dasharray="4 2" stroke-width="1.5" x1="50%" x2="65%" y1="50%" y2="35%"></line>
<!-- Line to Node 2 -->
<line stroke="rgba(136, 115, 104, 0.3)" stroke-width="1" x1="50%" x2="30%" y1="50%" y2="40%"></line>
<!-- Line to Node 3 -->
<line stroke="rgba(136, 115, 104, 0.3)" stroke-width="1" x1="50%" x2="45%" y1="50%" y2="70%"></line>
</svg>
<!-- Center Node (ME) -->
<div class="absolute z-10 flex flex-col items-center justify-center">
<div class="pulse-ring"></div>
<div class="pulse-ring" style="animation-delay: 1s;"></div>
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shadow-lg relative z-20">
<span class="font-label-lg text-label-lg text-on-primary">ME</span>
</div>
</div>
<!-- Node 1 (Riya) - Active -->

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="mt-2 bg-surface/90 backdrop-blur-sm px-2 py-1 rounded border border-outline-variant shadow-sm text-center">
<p class="font-label-lg text-label-lg text-on-surface">Riya</p>
<p class="font-label-md text-label-md text-primary">2 hops</p>
</div>
</button>

<div class="flex items-center gap-gutter">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-title-lg font-title-lg">
                        R

<div>
