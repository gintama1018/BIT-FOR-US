<style>
        .radar-node {
            position: absolute;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(194, 101, 42, 0.05);
        }
        .connection-line {
            position: absolute;
            height: 1px;
            background-color: theme('colors.outline-variant');
            transform-origin: 0 0;
            z-index: 0;
        }
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid theme('colors.primary');
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            opacity: 0;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(2.5); opacity: 0; }
        }
      </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 w-full flex items-center justify-between px-container-padding py-stack-md bg-background dark:bg-background z-40 transition-all duration-300">
<button aria-label="Signal" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-lowest text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">signal_cellular_alt</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center flex-1">Network</h1>
<button aria-label="Emergency" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-lowest text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">emergency</span>
</button>
</header>
<main class="px-container-padding py-stack-md max-w-4xl mx-auto space-y-stack-lg">
<!-- Info Panel -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col justify-center items-center">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase mb-1">Mesh Health</span>
<span class="font-title-lg text-title-lg text-primary">Excellent</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col justify-center items-center">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase mb-1">Direct Links</span>
<span class="font-title-lg text-title-lg text-on-surface">5</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col justify-center items-center">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase mb-1">Discovered</span>
<span class="font-title-lg text-title-lg text-on-surface">12</span>
</div>
</section>
<!-- Topology Canvas -->
<section class="relative w-full h-[60vh] bg-surface-container-low border border-outline-variant rounded-2xl overflow-hidden mt-stack-md">
<!-- Grid Background -->
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(theme('colors.on-surface-variant') 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="relative w-full h-full" id="radar-container">
<!-- Lines will be injected here via JS -->
</div>
</section>
<!-- Node Legend -->
<section class="flex flex-wrap gap-4 justify-center mt-stack-sm text-sm">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Self</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full border-2 border-primary bg-surface-container-lowest"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Relay Node</span>
</div>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-on-surface-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Peer</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-container-padding py-stack-sm pb-8 bg-surface/80 backdrop-blur-md border-t border-outline-variant transition-colors">
<button class="flex flex-col items-center justify-center text-primary active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-lg">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">hub</span>
<span class="font-label-lg text-label-lg">Mesh</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-lg">

<span class="font-label-lg text-label-lg">Direct</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-lg">
<span class="material-symbols-outlined mb-1">explore</span>
<span class="font-label-lg text-label-lg">Radar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-lg">

<span class="font-label-lg text-label-lg">Logs</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-lg">
<span class="material-symbols-outlined mb-1">fingerprint</span>
<span class="font-label-lg text-label-lg">Identity</span>
</button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('radar-container');
            const centerX = container.clientWidth / 2;
            const centerY = container.clientHeight / 2;

            const nodes = [
                { id: 'me', type: 'self', x: centerX, y: centerY, label: 'ME' },
                { id: 'relay1', type: 'relay', x: centerX - 120, y: centerY - 80, label: 'R1' },
                { id: 'relay2', type: 'relay', x: centerX + 100, y: centerY + 110, label: 'R2' },
                { id: 'peer1', type: 'peer', x: centerX - 40, y: centerY - 150, label: '' },
                { id: 'peer2', type: 'peer', x: centerX - 200, y: centerY - 20, label: '' },
                { id: 'peer3', type: 'peer', x: centerX + 180, y: centerY - 40, label: '' },
                { id: 'peer4', type: 'peer', x: centerX + 40, y: centerY + 160, label: '' },
                { id: 'peer5', type: 'peer', x: centerX - 150, y: centerY + 100, label: '' },
            ];

            const links = [
                ['me', 'relay1'], ['me', 'relay2'],
                ['relay1', 'peer1'], ['relay1', 'peer2'], ['relay1', 'peer5'],
                ['relay2', 'peer3'], ['relay2', 'peer4'],
                ['me', 'peer4'], ['relay1', 'me'] // Redundant link for network feel
            ];

            // Draw links
            links.forEach(link => {
                const source = nodes.find(n => n.id === link[0]);
                const target = nodes.find(n => n.id === link[1]);
                if (source && target) {
                    const line = document.createElement('div');
                    line.className = 'connection-line';
                    
                    const length = Math.sqrt(Math.pow(target.x - source.x, 2) + Math.pow(target.y - source.y, 2));
                    const angle = Math.atan2(target.y - source.y, target.x - source.x) * 180 / Math.PI;

                    line.style.width = `${length}px`;
                    line.style.left = `${source.x}px`;
                    line.style.top = `${source.y}px`;
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    container.appendChild(line);
                }
            });

            // Draw nodes
            nodes.forEach(node => {
                const el = document.createElement('div');
                el.className = 'radar-node z-10 font-label-md text-label-md';
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;

                if (node.type === 'self') {
                    el.classList.add('w-12', 'h-12', 'bg-primary', 'text-on-primary');
                    el.innerText = node.label;
                    
                    // Add pulse rings
                    for(let i=0; i<2; i++) {
                        const ring = document.createElement('div');
                        ring.className = 'pulse-ring w-12 h-12';
                        ring.style.animationDelay = `${i * 1.5}s`;
                        el.appendChild(ring);
                    }
                } else if (node.type === 'relay') {
                    el.classList.add('w-10', 'h-10', 'border-2', 'border-primary', 'bg-surface-container-lowest', 'text-primary');
                    el.innerText = node.label;
                } else {
                    el.classList.add('w-4', 'h-4', 'bg-on-surface-variant');
                }

                container.appendChild(el);
            });
        });
    </script>
</body></html>
