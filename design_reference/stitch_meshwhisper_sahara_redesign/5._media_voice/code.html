<!DOCTYPE html>

<html lang="en"><head>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtly animated waveform bars */
        .waveform-bar {
            animation: pulse-height 1.5s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes pulse-height {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden font-body-lg text-body-lg">
<!-- Top App Bar (Direct match to JSON) -->
<header class="sticky top-0 w-full flex items-center justify-between px-container-padding py-stack-md bg-background dark:bg-background z-40 transition-all duration-300">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-lowest dark:hover:bg-surface-container-low transition-colors text-primary dark:text-primary-fixed-dim active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-primary-fixed-dim">Direct</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-lowest dark:hover:bg-surface-container-low transition-colors text-primary dark:text-primary-fixed-dim active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</header>
<!-- Main Chat Canvas -->
<main class="flex-1 px-container-padding py-stack-lg flex flex-col gap-stack-lg overflow-y-auto pb-32">
<!-- Day separator -->
<div class="flex justify-center w-full">
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full border border-outline-variant">Today</span>
</div>
<!-- 1. Image Message: Receiving/Transfer State -->
<div class="flex flex-col gap-unit max-w-[85%] self-start">
<div class="flex items-center gap-2 mb-1">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant overflow-hidden flex items-center justify-center">
<span class="font-label-lg text-label-lg text-on-surface">EL</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Elena Rostova</span>
</div>
<div class="relative bg-surface rounded-xl border border-outline-variant p-2 shadow-sm overflow-hidden group">
<!-- Image Preview (Blurred for pending transfer) -->
<div class="relative w-full aspect-[4/3] rounded-lg overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover filter blur-md opacity-60 transition-opacity duration-500" data-alt="A blurred, low-resolution preview of an arid, sunlit desert landscape. Warm terracotta sand dunes and clear skies are visible through a heavily pixelated or frosted glass effect, indicating an incomplete file transfer. The style is modern, minimalist, and serene, fitting a light-mode Saharan aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNFrVq8nOzuAUIZiCXnsv1bajNdCAu68RjzWlQ0LMwxMvAYI15TCrXYQm9gYYEuX1ST_tJP-VoJxxMl3AqLm1jHMt9ngYDKf2n3KQmecOiBoFKQqX4DMh4iAzBEDW5_KlsajzrDTIefmZPLvHDJWmDEjB_YbbTfbOfD49OUm9idlMPWOCpY_ePCD1MgPlRljV1YGL4FSqojrn77vX31pX-PGIkuR_aYPD-E-2_2kyOCblvkOgwO_zM"/>
<!-- Transfer Progress Overlay -->
<div class="absolute inset-0 flex flex-col items-center justify-center bg-surface/40 backdrop-blur-sm z-10">
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- Circular Progress SVG -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-outline-variant/30" cx="50" cy="50" fill="none" r="45" stroke-width="4"></circle>
<circle class="stroke-primary" cx="50" cy="50" fill="none" r="45" stroke-dasharray="283" stroke-dashoffset="79.24" stroke-width="4"></circle> <!-- 72% of 283 = ~203.76, 283-203.76 = 79.24 -->
</svg>
<span class="absolute font-label-lg text-label-lg text-primary">72%</span>
</div>
</div>
</div>
<!-- Metadata -->
<div class="flex items-center justify-between mt-3 px-2 pb-1">
<div class="flex items-center gap-1.5 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-md text-label-md">Encrypted • 1.8 MB</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant opacity-60">10:42 AM</span>
</div>
</div>
</div>
<!-- 2. Voice Note Message -->
<div class="flex flex-col gap-unit max-w-[85%] self-end">
<div class="relative bg-surface-container-low rounded-xl border border-outline-variant p-4 shadow-sm">
<div class="flex items-center gap-4">
<!-- Play Button -->
<button class="w-10 h-10 flex-shrink-0 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_4px_20px_rgba(194,101,42,0.15)] hover:bg-surface-tint transition-colors">
<span class="material-symbols-outlined filled-icon">play_arrow</span>
</button>
<!-- Waveform visualization (static for played message) -->
<div class="flex-1 flex items-center gap-0.5 h-8">
<!-- Example static bars -->
<div class="w-1 h-3 bg-primary/40 rounded-full"></div>
<div class="w-1 h-5 bg-primary/40 rounded-full"></div>
<div class="w-1 h-4 bg-primary/40 rounded-full"></div>
<div class="w-1 h-7 bg-primary rounded-full"></div>
<div class="w-1 h-6 bg-primary rounded-full"></div>
<div class="w-1 h-8 bg-primary rounded-full"></div>
<div class="w-1 h-5 bg-primary rounded-full"></div>
<div class="w-1 h-4 bg-primary rounded-full"></div>
<div class="w-1 h-6 bg-primary/40 rounded-full"></div>
<div class="w-1 h-3 bg-primary/40 rounded-full"></div>
<div class="w-1 h-2 bg-primary/40 rounded-full"></div>
<div class="w-1 h-4 bg-primary/40 rounded-full"></div>
</div>
<!-- Duration -->
<span class="font-label-lg text-label-lg text-on-surface">0:14</span>
</div>
<div class="flex items-center justify-end mt-2">
<span class="font-label-md text-label-md text-on-surface-variant opacity-60">10:45 AM</span>
</div>
</div>
</div>
</main>
<!-- Active Voice Recording Overlay (Simulating being anchored to input area) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant p-stack-md z-[60] flex flex-col gap-6 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] transform translate-y-0 transition-transform duration-300">
<div class="flex flex-col items-center text-center gap-2">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-error animate-pulse">00:14</span>
<span class="font-body-md text-body-md text-on-surface-variant">Recording voice note...</span>
</div>
<!-- Large Active Waveform -->
<div class="flex items-center justify-center gap-1 h-16 px-container-padding">
<div class="w-1.5 h-4 bg-error rounded-full waveform-bar" style="animation-delay: 0.1s"></div>
<div class="w-1.5 h-8 bg-error rounded-full waveform-bar" style="animation-delay: 0.2s"></div>
<div class="w-1.5 h-6 bg-error rounded-full waveform-bar" style="animation-delay: 0.3s"></div>
<div class="w-1.5 h-12 bg-error rounded-full waveform-bar" style="animation-delay: 0.4s"></div>
<div class="w-1.5 h-10 bg-error rounded-full waveform-bar" style="animation-delay: 0.5s"></div>
<div class="w-1.5 h-14 bg-error rounded-full waveform-bar" style="animation-delay: 0.6s"></div>
<div class="w-1.5 h-8 bg-error rounded-full waveform-bar" style="animation-delay: 0.7s"></div>
<div class="w-1.5 h-12 bg-error rounded-full waveform-bar" style="animation-delay: 0.8s"></div>
<div class="w-1.5 h-6 bg-error rounded-full waveform-bar" style="animation-delay: 0.9s"></div>
<div class="w-1.5 h-10 bg-error rounded-full waveform-bar" style="animation-delay: 1.0s"></div>
<div class="w-1.5 h-4 bg-error rounded-full waveform-bar" style="animation-delay: 1.1s"></div>
</div>
<!-- Actions -->
<div class="flex items-center justify-between pt-4">
<button class="px-6 py-3 font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors active:scale-95 duration-200">
                Cancel
            </button>
<button class="w-14 h-14 rounded-full bg-error text-on-error flex items-center justify-center shadow-[0_4px_20px_rgba(186,26,26,0.2)] hover:bg-on-error-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined filled-icon text-3xl">stop</span>
</button>
</div>
<!-- Safe area padding for mobile -->
<div class="h-6"></div>
</div>
<!-- Hidden BottomNav (Suppressed because user is in a focused transactional flow / chat context) -->
<!-- The BottomNav shell is excluded based on the "Task-Focused" rule. -->
</body></html>
